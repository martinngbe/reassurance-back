services:
  reassurance-back:
    # build: .
    image: reassusrance-back:0.0.1
    container_name: reassurance-back
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
      # Base de données
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USERNAME=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=reass
      # ✅ JWT Secret (à changer en production !)
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_EXPIRATION=3600
    volumes:
      - app_logs:/app/logs
    networks:
      - mariadb_network

networks:
  mariadb_network:
    external: true
    name: mariadb_network

volumes:
  app_logs: